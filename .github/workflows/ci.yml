name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      # Reporting-only for now: the tree currently has pre-existing ruff and mypy
      # findings. Drop `continue-on-error` once they are cleared so static
      # analysis gates the build.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true
      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true
      - name: Test
        run: pytest --cov=src --cov-report=xml
